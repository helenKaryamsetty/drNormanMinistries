<section class="global-impact" id="impact">
  <div class="impact-container">
    <div class="impact-header">
      <span class="impact-eyebrow">Global Impact</span>
      <h2>A ministry measured in <em>generations.</em></h2>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid">
      <div *ngFor="let stat of stats" class="stat-card">
        <div class="stat-number">{{ stat.number }}</div>
        <div class="stat-label">{{ stat.label }}</div>
      </div>
    </div>

    <!-- Testimonials -->
    <div class="testimonials-section">
      <h3>Voices of Impact</h3>
      <div class="testimonials-grid">
        <div *ngFor="let testimonial of testimonials" class="testimonial-card">
          <blockquote>
            <p>"{{ testimonial.quote }}"</p>
            <footer>
              <strong>{{ testimonial.author }}</strong>
              <span>{{ testimonial.role }}</span>
            </footer>
          </blockquote>
        </div>
      </div>
    </div>

    <p class="impact-note">Stats and testimonials shown are sample content — swap in verified figures and real quotes before launch.</p>
  </div>
</section>
